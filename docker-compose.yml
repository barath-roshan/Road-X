# ==============================================================================
# RoadX Docker Compose Configuration (Phase 22)
#
# Provides a reproducible, local multi-container deployment consisting of:
# 1. PostgreSQL 15 database service with persistent volume & health check.
# 2. RoadX FastAPI service with automated startup migrations and persistent storage.
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: roadx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadx_db}
      POSTGRES_USER: ${POSTGRES_USER:-roadx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadx_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bind exclusively to 127.0.0.1 (not exposed publicly)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadx_user} -d ${POSTGRES_DB:-roadx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - roadx-network

  roadx-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadx-api:latest
    container_name: roadx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ROADX_ENV: ${ROADX_ENV:-development}
      ROADX_LOG_LEVEL: ${ROADX_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-roadx_user}:${POSTGRES_PASSWORD:-roadx_password}@postgres:5432/${POSTGRES_DB:-roadx_db}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ROADX_MLFLOW_ENABLED: ${ROADX_MLFLOW_ENABLED:-true}
      ROADX_MLFLOW_TRACKING_URI: ${ROADX_MLFLOW_TRACKING_URI:-file:///app/models/mlruns}
      ROADX_LLM_PROVIDER: ${ROADX_LLM_PROVIDER:-mock}
      ROADX_LLM_MODEL: ${ROADX_LLM_MODEL:-llama3-8b-8192}
      ROADX_LLM_API_KEY: ${ROADX_LLM_API_KEY:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
    volumes:
      - roadx_data:/app/data
      - roadx_models:/app/models/monitoring
      - roadx_logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - roadx-network

volumes:
  postgres_data:
    name: roadx_postgres_data
  roadx_data:
    name: roadx_data
  roadx_models:
    name: roadx_models
  roadx_logs:
    name: roadx_logs

networks:
  roadx-network:
    name: roadx-network
    driver: bridge
